<script>
  // ─────────────────────────────────────────────────────────────────────
  // Vanilla JS dashboard — no Alpine, no eval, CSP-safe.
  // Bootstrap JSON is injected into <script type="application/json">
  // tags in WebApp.html (because include()'d files don't evaluate scriptlets).
  // ─────────────────────────────────────────────────────────────────────

  function safeParse_(text, fallback) {
    try { return JSON.parse(text); } catch (e) { return fallback; }
  }

  var __BOOTSTRAP__ = (function () {
    var el = document.getElementById('__bootstrap-data__');
    return safeParse_(el ? el.textContent : 'null', null);
  })();
  var __USER__ = (function () {
    var el = document.getElementById('__user-data__');
    return safeParse_(el ? el.textContent : '{"email":""}', { email: '' });
  })();

  var POLL_INTERVAL_MS = 5000;
  var ALERT_TABS = ['critical', 'warning', 'lwd', 'probation'];
  var PAGE_TABS = ['overview', 'alerts', 'alertengine', 'finance', 'productivity', 'manage', 'org', 'drilldown'];

  var state = {
    snapshot: (__BOOTSTRAP__ && !__BOOTSTRAP__.error) ? __BOOTSTRAP__ : null,
    bootstrapError: (__BOOTSTRAP__ && __BOOTSTRAP__.error) ? __BOOTSTRAP__.error : null,
    userEmail: (__USER__ && __USER__.email) || '',
    activeTab: 'overview',
    alertTab: 'critical',
    drilldown: { region: 'All', dept: 'All', rm: 'All', status: 'All', text: '', rows: [], count: 0 },
    manage: { region: 'All', dept: 'All', status: 'All', text: '', rows: [], count: 0 },
    prod:   { region: 'All', dept: 'All', project: 'All', text: '', rows: [] },
    lastUpdated: null,
    pollTimer: null
  };

  // ──────────────────────────────────────────────────────────────────────
  // Boot
  // ──────────────────────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('user-email').textContent = state.userEmail;
    document.getElementById('user-initial').textContent = (state.userEmail || '?').charAt(0).toUpperCase();
    document.getElementById('poll-interval').textContent = String(POLL_INTERVAL_MS / 1000);

    if (state.bootstrapError) {
      showError('Bootstrap snapshot failed: ' + state.bootstrapError);
    }

    if (state.snapshot) {
      state.lastUpdated = new Date();
      renderAll();
      refreshDrilldown();
    }

    // Wire up filter dropdowns
    document.querySelectorAll('[data-filter]').forEach(function (sel) {
      if (sel.type === 'text') {
        sel.addEventListener('input', debounce(onFilterChange, 250));
      } else {
        sel.addEventListener('change', onFilterChange);
      }
    });

    // Wire up page-level tabs
    document.querySelectorAll('.tab-link[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activatePageTab(btn.getAttribute('data-tab'));
      });
    });

    // Manage Employees filters + search
    ['manage-filter-region','manage-filter-dept','manage-filter-status'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', function (e) {
        var key = id.split('-').pop(); state.manage[key] = e.target.value; refreshManageTable();
      });
    });
    var manageSearch = document.getElementById('manage-search');
    if (manageSearch) manageSearch.addEventListener('input', debounce(function (e) {
      state.manage.text = e.target.value; refreshManageTable();
    }, 250));
    var addBtn = document.getElementById('btn-add-employee');
    if (addBtn) addBtn.addEventListener('click', openAddEmployeeModal);

    // Productivity filters + search
    ['prod-filter-region','prod-filter-dept','prod-filter-project'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', function (e) {
        var key = id.split('-').pop(); state.prod[key] = e.target.value; renderProductivityTab(state.snapshot);
      });
    });
    var prodSearch = document.getElementById('prod-search');
    if (prodSearch) prodSearch.addEventListener('input', debounce(function (e) {
      state.prod.text = e.target.value; renderProductivityTab(state.snapshot);
    }, 250));

    // Polling
    startPolling();
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Tick last-updated label
    setInterval(updateLastUpdatedLabel, 15000);

    // Force an immediate poll if no bootstrap
    if (!state.snapshot) setTimeout(refresh, 100);
  });

  function startPolling() {
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = setInterval(refresh, POLL_INTERVAL_MS);
  }
  function handleVisibilityChange() {
    if (document.hidden) {
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
    } else {
      refresh();
      startPolling();
    }
  }
  function refresh() {
    google.script.run
      .withSuccessHandler(function (snap) {
        if (!snap) return;
        if (snap.error) { showError(snap.error); return; }
        hideError();
        state.snapshot = snap;
        state.lastUpdated = new Date();
        renderAll();
      })
      .withFailureHandler(function (err) {
        console.error('api_snapshot poll failed:', err && err.message ? err.message : err);
      })
      .api_snapshot();
  }

  function showError(msg) {
    var bn = document.getElementById('error-banner');
    bn.classList.remove('hidden');
    document.getElementById('error-message').textContent = msg;
  }
  function hideError() {
    document.getElementById('error-banner').classList.add('hidden');
  }

  // ──────────────────────────────────────────────────────────────────────
  // Render orchestrator
  // ──────────────────────────────────────────────────────────────────────

  function renderAll() {
    var s = state.snapshot;
    if (!s) return;

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('tab-nav').classList.remove('hidden');
    activatePageTab(state.activeTab);

    renderSystemHealth(s);
    renderKpis(s);
    renderHealth(s);
    renderAlerts(s);
    renderDepartmentBreakdown(s);
    renderAttritionTrend(s);
    renderOrgGroups(s);
    renderDrillDownFilters(s);
    if (typeof renderRecsAndRaw === 'function') renderRecsAndRaw(s);
    if (typeof renderFinance === 'function') renderFinance(s);
    if (typeof renderProductivityTab === 'function') renderProductivityTab(s);
    renderManageFilters(s);
    refreshManageTable();
    updateAlertsTabCount(s);
    updateLastUpdatedLabel();
  }

  function activatePageTab(name) {
    if (PAGE_TABS.indexOf(name) === -1) name = 'overview';
    state.activeTab = name;
    document.querySelectorAll('[data-tab-content]').forEach(function (panel) {
      if (panel.getAttribute('data-tab-content') === name) panel.classList.remove('hidden');
      else panel.classList.add('hidden');
    });
    document.querySelectorAll('.tab-link[data-tab]').forEach(function (btn) {
      if (btn.getAttribute('data-tab') === name) btn.classList.add('tab-link-active');
      else btn.classList.remove('tab-link-active');
    });
  }

  function updateAlertsTabCount(s) {
    var alerts = (s && s.alerts) || {};
    var total = ((alerts.critical || []).length) + ((alerts.warning || []).length);
    var el = document.getElementById('tab-alerts-count');
    if (el) el.textContent = String(total);
  }

  // ──────────────────────────────────────────────────────────────────────
  // System health (header)
  // ──────────────────────────────────────────────────────────────────────

  function renderSystemHealth(s) {
    var sh = s.systemHealth || {};
    var ok = !!sh.ok && (!sh.issues || sh.issues.length === 0);
    document.getElementById('system-dot').className = 'inline-block w-2 h-2 rounded-full ' + (ok ? 'bg-green-500' : 'bg-red-500');
    document.getElementById('system-label').textContent = ok ? 'All systems OK' : ((sh.issues || []).length + ' issue(s)');
  }

  // ──────────────────────────────────────────────────────────────────────
  // KPI strip
  // ──────────────────────────────────────────────────────────────────────

  function renderKpis(s) {
    var defs = {
      headcount: { label: 'Headcount', tip: 'Total active employees (India + US). Excludes Offboarded.' },
      alerts:    { label: 'Active alerts', tip: 'Sum of critical + warning alerts surfaced on the Alerts tab.' },
      health:    { label: 'HR Health Score', tip: '4-pillar additive score 0–100. Formula in SOP §4.' },
      attrition: { label: 'Quarterly attrition', tip: '(Current quarter offboardings) / (avg headcount this quarter).' }
    };
    var html = (s.kpis || []).map(function (k, i) {
      var def = defs[k.id || ''] || { tip: '' };
      return '' +
        '<div class="kpi" data-kpi="' + esc(k.id || ('k' + i)) + '" title="' + esc(def.tip || '') + '">' +
          '<div class="kpi-label">' + esc(k.label) + '</div>' +
          '<div class="kpi-value tone-' + esc(k.tone || 'neutral') + '">' + esc(String(k.value)) + '</div>' +
          '<div class="kpi-hint">' + esc(k.hint || '') + '</div>' +
        '</div>';
    }).join('');
    var grid = document.getElementById('kpis-grid');
    grid.innerHTML = html;
    grid.querySelectorAll('[data-kpi]').forEach(function (el) {
      el.addEventListener('click', function () { onKpiClick(el.getAttribute('data-kpi')); });
    });
  }

  function onKpiClick(id) {
    var s = state.snapshot;
    if (id === 'alerts') { activatePageTab('alerts'); return; }
    if (id === 'health') {
      var h = (s && s.health) || {};
      openModal('<h3 style="font-size:16px;font-weight:600;margin:0 0 12px;">HR Health Score · ' + (h.total || 0) + '</h3>' +
        '<p class="text-xs text-gray-500 mb-3">Sum of four pillars, each capped at 25 points.</p>' +
        Object.keys(h.pillars || {}).map(function (k) {
          return '<div class="flex justify-between text-sm py-1"><span>' + esc(k) + '</span><span class="font-semibold">' + Math.round(h.pillars[k] || 0) + ' / 25</span></div>';
        }).join('') +
        '<div class="flex justify-end mt-4"><button id="btn-cancel" class="btn-ghost">Close</button></div>');
      document.getElementById('btn-cancel').addEventListener('click', closeModal);
      return;
    }
    if (id === 'headcount') {
      var hc = (s && s.headcount) || {};
      openModal('<h3 style="font-size:16px;font-weight:600;margin:0 0 12px;">Headcount</h3>' +
        '<div class="flex justify-between text-sm py-1"><span>India</span><span class="font-semibold">' + (hc.india || 0) + '</span></div>' +
        '<div class="flex justify-between text-sm py-1"><span>US</span><span class="font-semibold">' + (hc.us || 0) + '</span></div>' +
        '<div class="flex justify-end mt-4"><button id="btn-cancel" class="btn-ghost">Close</button></div>');
      document.getElementById('btn-cancel').addEventListener('click', closeModal);
      return;
    }
    if (id === 'attrition') { activatePageTab('overview'); return; }
  }

  // ──────────────────────────────────────────────────────────────────────
  // HR Health Score
  // ──────────────────────────────────────────────────────────────────────

  function renderHealth(s) {
    var h = s.health || {};
    var total = typeof h.total === 'number' ? h.total : 0;
    var band = healthBand(total);
    var pillars = h.pillars || {};
    var inputs = h.inputs || {};

    document.getElementById('health-asof').textContent = s.generatedAtLabel || '';
    document.getElementById('health-total').textContent = String(total);
    document.getElementById('health-total').className = 'donut-label tone-' + band.toneClass;
    document.getElementById('health-donut').style.background =
      'conic-gradient(' + band.color + ' 0% ' + total + '%, #F4F4F5 ' + total + '% 100%)';

    var badge = document.getElementById('health-band-badge');
    badge.textContent = band.label;
    badge.className = 'badge ' + band.badgeClass;

    var labels = { stability: 'Stability', alertLoad: 'Alert Load', riskPosture: 'Risk Posture', productivity: 'Productivity' };
    var pillarHtml = Object.keys(labels).map(function (key) {
      var v = typeof pillars[key] === 'number' ? pillars[key] : 0;
      var pct = Math.round((v / 25) * 100);
      return '' +
        '<div style="margin-bottom:12px;">' +
          '<div class="flex justify-between text-sm mb-1">' +
            '<span class="font-medium text-gray-700">' + esc(labels[key]) + '</span>' +
            '<span class="text-gray-500 text-xs"><span class="font-semibold text-gray-900">' + esc(String(v)) + '</span> / 25</span>' +
          '</div>' +
          '<div class="pillar-bar"><div style="width:' + pct + '%; background:' + band.color + ';"></div></div>' +
        '</div>';
    }).join('');
    document.getElementById('health-pillars').innerHTML = pillarHtml;

    var qa = inputs.quarterlyAttrition;
    var inputsHtml = '' +
      '<div><div class="text-gray-500">Quarterly Attrition</div><div class="font-semibold text-gray-900">' + (typeof qa === 'number' ? (qa * 100).toFixed(1) + '%' : '—') + '</div></div>' +
      '<div><div class="text-gray-500">Critical Alerts</div><div class="font-semibold text-gray-900">' + esc(String(inputs.criticalAlerts || 0)) + '</div></div>' +
      '<div><div class="text-gray-500">Risky Window</div><div class="font-semibold text-gray-900">' + esc(String(inputs.riskyEmployees || 0)) + ' / ' + esc(String(inputs.headcount || 0)) + '</div></div>' +
      '<div><div class="text-gray-500">Avg Productivity</div><div class="font-semibold text-gray-900">' + (typeof inputs.avgProductivity === 'number' ? (inputs.avgProductivity * 100).toFixed(0) + '%' : '—') + '</div></div>';
    document.getElementById('health-inputs').innerHTML = inputsHtml;
  }

  function healthBand(score) {
    if (score >= 80) return { label: 'Green', toneClass: 'good',    badgeClass: 'badge-ok',       color: '#059669' };
    if (score >= 60) return { label: 'Amber', toneClass: 'warn',    badgeClass: 'badge-warning',  color: '#D97706' };
    return                  { label: 'Red',   toneClass: 'danger',  badgeClass: 'badge-critical', color: '#DC2626' };
  }

  // ──────────────────────────────────────────────────────────────────────
  // Alerts (tabbed)
  // ──────────────────────────────────────────────────────────────────────

  function renderAlerts(s) {
    var alerts = s.alerts || { critical: [], warning: [], lwd: [], probation: [] };

    // Tabs
    var tabsEl = document.getElementById('alerts-tabs');
    tabsEl.innerHTML = ALERT_TABS.map(function (key) {
      var count = (alerts[key] || []).length;
      var label = key.charAt(0).toUpperCase() + key.slice(1);
      var active = key === state.alertTab ? 'tab-active' : '';
      return '<div class="tab ' + active + '" data-tab="' + esc(key) + '">' + esc(label) +
             ' <span class="text-gray-400">(' + count + ')</span></div>';
    }).join('');
    tabsEl.querySelectorAll('[data-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        state.alertTab = el.getAttribute('data-tab');
        renderAlerts(state.snapshot);
      });
    });

    // Summary
    document.getElementById('alerts-summary').innerHTML =
      '<span class="font-semibold text-red-600">' + (alerts.critical || []).length + '</span> critical · ' +
      '<span class="font-semibold text-yellow-600">' + (alerts.warning || []).length + '</span> warning';

    // Table
    var current = alerts[state.alertTab] || [];
    var wrap = document.getElementById('alerts-table-wrap');
    if (current.length === 0) {
      wrap.innerHTML = '<div class="text-gray-500 text-sm py-8 text-center">' +
        (state.alertTab === 'critical' ? 'No critical alerts. Healthy.' : 'No active alerts in this category.') +
        '</div>';
      return;
    }
    var rows = current.map(function (a) {
      return '<tr>' +
        '<td class="font-mono text-xs text-gray-500">' + esc(a.empId) + '</td>' +
        '<td class="font-medium">' + esc(a.name) + '</td>' +
        '<td class="text-gray-600">' + esc(a.dept) + '</td>' +
        '<td class="text-gray-600">' + esc(a.region || '') + '</td>' +
        '<td class="text-gray-600">' + esc(a.kind) + '</td>' +
        '<td>' + esc(a.message) + '</td>' +
        '<td><span class="' + severityBadgeClass(a.severity) + '">' + esc(a.severity) + '</span></td>' +
        '</tr>';
    }).join('');
    wrap.innerHTML = '<table class="data">' +
      '<thead><tr><th>Emp ID</th><th>Name</th><th>Dept</th><th>Region</th><th>Type</th><th>Detail</th><th>Severity</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  function severityBadgeClass(sev) {
    if (sev === 'critical') return 'badge badge-critical';
    if (sev === 'warning')  return 'badge badge-warning';
    return 'badge badge-info';
  }

  // ──────────────────────────────────────────────────────────────────────
  // Department breakdown
  // ──────────────────────────────────────────────────────────────────────

  function renderDepartmentBreakdown(s) {
    var depts = s.departmentBreakdown || [];
    if (depts.length === 0) {
      document.getElementById('dept-list').innerHTML =
        '<div class="text-gray-500 text-sm py-6 text-center">No department data.</div>';
      return;
    }
    var html = depts.map(function (d) {
      var total = d.total || 0;
      var conf = d.confirmed || 0, prob = d.probation || 0, intern = d.intern || 0;
      var confPct = total ? (conf / total) * 100 : 0;
      var probPct = total ? (prob / total) * 100 : 0;
      var intPct = total ? (intern / total) * 100 : 0;
      return '<div>' +
        '<div class="flex justify-between text-sm mb-1">' +
          '<span class="font-medium text-gray-700">' + esc(d.dept) + '</span>' +
          '<span class="text-gray-500 text-xs"><span class="font-semibold text-gray-900">' + total + '</span> total' +
            (conf > 0 ? ' &middot; <span class="text-green-600">' + conf + ' conf</span>' : '') +
            (prob > 0 ? ' &middot; <span class="text-yellow-600">' + prob + ' prob</span>' : '') +
            (intern > 0 ? ' &middot; <span class="text-indigo-600">' + intern + ' int</span>' : '') +
          '</span>' +
        '</div>' +
        '<div class="flex h-2 w-full rounded-full overflow-hidden bg-gray-100">' +
          '<div class="bg-green-500" style="width:' + confPct + '%"></div>' +
          '<div class="bg-yellow-500" style="width:' + probPct + '%"></div>' +
          '<div class="bg-indigo-500" style="width:' + intPct + '%"></div>' +
        '</div>' +
      '</div>';
    }).join('');
    document.getElementById('dept-list').innerHTML = html;
  }

  // ──────────────────────────────────────────────────────────────────────
  // Attrition trend
  // ──────────────────────────────────────────────────────────────────────

  function renderAttritionTrend(s) {
    var trend = s.attritionTrend || [];
    if (trend.length === 0) {
      document.getElementById('attr-list').innerHTML =
        '<div class="text-gray-500 text-sm py-6 text-center">No attrition data.</div>';
      return;
    }
    var html = trend.map(function (q) {
      var pctW = Math.min((q.rate || 0) * 400, 100);
      var rateCls = q.rate > 0.10 ? 'text-red-600' : (q.rate > 0.05 ? 'text-yellow-600' : 'text-green-600');
      var barCls = q.rate > 0.10 ? 'bg-red-500' : (q.rate > 0.05 ? 'bg-yellow-500' : 'bg-green-500');
      return '<div>' +
        '<div class="flex justify-between text-sm mb-1">' +
          '<span class="font-medium text-gray-700">' + esc(q.quarter) + '</span>' +
          '<span class="text-gray-500 text-xs"><span class="font-semibold text-gray-900">' + (q.count || 0) + ' exits</span> ' +
          '<span class="ml-2 ' + rateCls + '">' + ((q.rate || 0) * 100).toFixed(2) + '%</span></span>' +
        '</div>' +
        '<div class="pillar-bar"><div class="' + barCls + '" style="width:' + pctW + '%"></div></div>' +
      '</div>';
    }).join('');
    document.getElementById('attr-list').innerHTML = html;
  }

  // ──────────────────────────────────────────────────────────────────────
  // Org View — grouped by Reporting Manager (card grid)
  // ──────────────────────────────────────────────────────────────────────

  function renderOrgGroups(s) {
    var groups = (s && s.orgGroups) || [];
    var el = document.getElementById('org-groups-grid');
    if (!el) return;

    var meta = document.getElementById('org-meta');
    if (meta) {
      var totalEmployees = groups.reduce(function (a, g) { return a + (g.count || 0); }, 0);
      meta.textContent = groups.length + ' manager(s) · ' + totalEmployees + ' employee(s)';
    }

    if (!groups.length) {
      el.innerHTML = '<div class="text-gray-500 text-sm py-8 text-center">No employees to group.</div>';
      return;
    }

    var html = groups.map(function (g) {
      var noMgr = g.manager === 'No Manager';
      var pills = (g.reports || []).map(function (r) {
        var pillCls = 'org-pill';
        if (r.status === 'Under Probation') pillCls += ' org-pill-probation';
        else if (r.status === 'Intern') pillCls += ' org-pill-intern';
        var title = (r.dept || '') + (r.designation ? ' · ' + r.designation : '') +
                    (r.status ? ' · ' + r.status : '');
        return '<span class="' + pillCls + '" title="' + esc(title) + '">' + esc(r.name || r.empId || '') + '</span>';
      }).join('');
      return '<div class="org-group' + (noMgr ? ' org-group-no-mgr' : '') + '">' +
        '<div class="org-group-header">' +
          '<span>' + esc(g.manager) + '</span>' +
          '<span class="dot">·</span>' +
          '<span class="count">' + (g.count || 0) + '</span>' +
        '</div>' +
        '<div class="org-pills">' + pills + '</div>' +
      '</div>';
    }).join('');
    el.innerHTML = html;
  }

  // ──────────────────────────────────────────────────────────────────────
  // Drill-down
  // ──────────────────────────────────────────────────────────────────────

  function renderDrillDownFilters(s) {
    var f = s.drilldownFilters || {};
    setOptions('filter-region', f.regions || ['All']);
    setOptions('filter-dept', f.departments || ['All']);
    setOptions('filter-rm', f.reportingManagers || ['All']);
    setOptions('filter-status', f.statuses || ['All']);
  }

  function setOptions(id, items) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var current = sel.value || 'All';
    sel.innerHTML = items.map(function (v) {
      var selected = v === current ? ' selected' : '';
      return '<option value="' + esc(v) + '"' + selected + '>' + esc(v) + '</option>';
    }).join('');
  }

  function onFilterChange(e) {
    var key = e.target.getAttribute('data-filter');
    state.drilldown[key] = e.target.value;
    refreshDrilldown();
  }

  function refreshDrilldown() {
    google.script.run
      .withSuccessHandler(function (result) {
        state.drilldown.rows = (result && result.rows) || [];
        state.drilldown.count = (result && result.count) || 0;
        renderDrillDownTable();
      })
      .withFailureHandler(function (err) {
        console.error('api_drilldown failed:', err && err.message ? err.message : err);
      })
      .api_drilldown({
        region: state.drilldown.region,
        dept: state.drilldown.dept,
        rm: state.drilldown.rm,
        status: state.drilldown.status,
        text: state.drilldown.text
      });
  }

  function renderDrillDownTable() {
    document.getElementById('drilldown-count').textContent = String(state.drilldown.count);
    var wrap = document.getElementById('drilldown-table-wrap');
    if (!state.drilldown.rows.length) {
      wrap.innerHTML = '<div class="text-gray-500 text-sm py-8 text-center">No employees match the current filters.</div>';
      return;
    }
    var rows = state.drilldown.rows.map(function (e) {
      var statusBadge = 'badge ' + (e.status === 'Confirmed' ? 'badge-ok' : e.status === 'Under Probation' ? 'badge-warning' : 'badge-info');
      return '<tr>' +
        '<td>' + riskDot(e) + '</td>' +
        '<td class="font-mono text-xs text-gray-500">' + esc(e.empId) + '</td>' +
        '<td class="font-medium">' + esc(e.name) + '</td>' +
        '<td class="text-gray-600">' + esc(e.region) + '</td>' +
        '<td class="text-gray-600">' + esc(e.dept) + '</td>' +

  function updateLastUpdatedLabel() {

      return;

    var secs = Math.floor((Date.now() - state.lastUpdated.getTime()) / 1000);
    var label;
    if (secs < 10) label = 'just now';
    else if (secs < 60) label = secs + 's ago';
    else if (secs < 3600) label = Math.floor(secs / 60) + 'm ago';
    else label = Math.floor(secs / 3600) + 'h ago';
    document.getElementById('last-updated').textContent = label;
  }

  function fmtDate(iso) {
    if (!iso) return '';

    if (isNaN(d.getTime())) return '';
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    });
  }

  // ──────────────────────────────────────────────────────────────────────
  // Client-side risk dot — mirrors server Risk.tier logic.
  // Uses independent if-blocks for red rules (accumulate-all, like the server).
  // Includes the probation amber rule the server has.
  // ──────────────────────────────────────────────────────────────────────

  function riskDot(emp) {
    var reasons = [], tier = 'green';
    var now = new Date();
    var lwdDays = emp.lwd ? Math.round((new Date(emp.lwd) - now) / 86400000) : null;
    var doj = emp.doj ? new Date(emp.doj) : null;
    var probDays = (doj && !isNaN(doj.getTime()) && emp.status === 'Under Probation')
      ? Math.round((doj.getTime() + 180 * 86400000 - now.getTime()) / 86400000)
      : null;
    var prod = typeof emp.productivity === 'number' ? emp.productivity : null;
    var alloc = typeof emp.allocationPct === 'number' ? emp.allocationPct : null;

    // Red rules (independent, accumulate reasons)
    if (emp.status === 'Offboarded') { tier='red'; reasons.push('Status: Offboarded'); }
    if (lwdDays !== null && lwdDays >= 0 && lwdDays < 14) { tier='red'; reasons.push('LWD in '+lwdDays+'d'); }
    if (prod !== null && prod < 0.50) { tier='red'; reasons.push('Productivity '+prod.toFixed(2)); }

    if (tier !== 'red') {
      // Amber rules (only if not red)
      if (lwdDays !== null && lwdDays >= 0 && lwdDays < 45) { tier='amber'; reasons.push('LWD in '+lwdDays+'d'); }
      if (probDays !== null && probDays < 30) { tier='amber'; reasons.push('Confirmation in '+probDays+'d'); }
      if (prod !== null && prod < 0.70) { tier='amber'; reasons.push('Productivity '+prod.toFixed(2)); }
      if (alloc !== null && alloc < 0.40) { tier='amber'; reasons.push('Allocation '+Math.round(alloc*100)+'%'); }
    }
    var title = reasons.length ? reasons.join(' · ') : 'Healthy';
    return '<span class="risk-dot risk-'+tier+'" title="'+esc(title)+'"></span>';
  }

function sparklineSvg_(values) {
  if (!values.length) return '';
  var w = 60, h = 16, max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function (v, i) {
    var x = (i / (values.length - 1 || 1)) * w;
    var y = h - ((v - min) / range) * h;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><polyline fill="none" stroke="#4F46E5" stroke-width="1.5" points="' + pts + '"/></svg>';
}

function openManagerEmailModal(empId) {
  google.script.run.withSuccessHandler(function (result) {
    if (!result.ok) { alert('Failed: ' + result.message); return; }
    openModal('<h3 style="font-size:16px;font-weight:600;margin:0 0 12px;">' + esc(result.subject || '') + '</h3>' +
      '<div style="font-size:13px;border:1px solid #E4E4E7;padding:12px;border-radius:8px;max-height:380px;overflow-y:auto;">' + (result.body || '') + '</div>' +
      '<div class="mt-4"><label class="modal-label">Send to (manager email)</label>' +
      '<input id="field-mailto" type="email" class="modal-input" placeholder="manager@techolution.com" /></div>' +
      '<div class="flex justify-end gap-2 mt-4"><button id="btn-cancel" class="btn-ghost">Cancel</button>' +
      '<button id="btn-send" class="btn-primary">Send</button></div>');
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-send').addEventListener('click', function () {
      var to = document.getElementById('field-mailto').value;
      if (!to) { alert('Email required'); return; }
      google.script.run.withSuccessHandler(function (sr) {
        alert(sr.ok ? (sr.message === 'Demo mode — not dispatched' ? 'Demo mode: would have sent.' : 'Sent.') : 'Failed: ' + sr.message);
        closeModal();
      }).api_sendManagerEmail(empId, to);
    });
  }).api_sendManagerEmail(empId, '');
}
</script>
