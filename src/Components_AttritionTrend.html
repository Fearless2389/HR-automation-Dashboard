<!-- Quarterly Attrition Trend -->
<section class="card" x-show="snapshot && snapshot.attritionTrend">
  <div class="card-title">Quarterly Attrition Trend</div>

  <div class="space-y-3" x-show="snapshot.attritionTrend.length > 0">
    <template x-for="(q, idx) in snapshot.attritionTrend" :key="q.quarter">
      <div>
        <div class="flex justify-between text-sm mb-1">
          <span class="font-medium text-zinc-700" x-text="q.quarter"></span>
          <span class="text-zinc-500 text-xs">
            <span class="font-semibold text-zinc-900" x-text="q.count + ' exits'"></span>
            <span class="ml-2" x-text="(q.rate * 100).toFixed(2) + '%'" :class="q.rate > 0.10 ? 'text-rose-600' : (q.rate > 0.05 ? 'text-amber-600' : 'text-emerald-600')"></span>
          </span>
        </div>
        <div class="pillar-bar">
          <div :style="`width: ${Math.min(q.rate * 400, 100)}%`" :class="q.rate > 0.10 ? 'bg-rose-500' : (q.rate > 0.05 ? 'bg-amber-500' : 'bg-emerald-500')"></div>
        </div>
      </div>
    </template>
  </div>

  <div x-show="snapshot.attritionTrend.length === 0" class="text-zinc-500 text-sm py-6 text-center">
    No attrition data.
  </div>

  <div class="mt-4 pt-3 border-t border-zinc-100 text-xs text-zinc-500">
    Computed from <code class="bg-zinc-100 px-1 rounded">Offboarded Resources</code> tab.
    Rate = exits / (current_headcount + exits).
  </div>
</section>
